name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint and metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the linters
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: flake8
        run: python3 -m flake8 src .github/scripts

      - name: Compile every Python file
        run: python3 -m compileall -q src .github/scripts

      - name: Manifests, assets and line endings
        run: python3 .github/scripts/check_manifests.py

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-22.04
    env:
      # Pinned so that a local run and this run report the same diagnostics.
      SHELLCHECK_VERSION: v0.10.0
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: shellcheck
        run: shellcheck --shell=bash scripts/*.sh

      - name: Parse check
        run: |
          for script in scripts/*.sh; do
            bash -n "${script}"
          done

  build-and-test:
    name: Build and test (ROS 2 Humble)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install the build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-numpy \
            python3-scipy \
            python3-opencv \
            python3-pytest

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Run the unit tests
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest src -q
